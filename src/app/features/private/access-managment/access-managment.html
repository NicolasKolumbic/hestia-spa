<hta-section-wrapper title="Usuarios y accesos" description="Gestión de usuarios, roles y alcance del cliente activo.">
    <ng-container header-tools>
        <hta-search-field placeholder="Buscar por email o nombre" class="w-[16rem]" />
        <hta-button label="Invitar usuario" icon="pi-user-plus" (click)="openInviteDialog()" />
    </ng-container>
    <hta-filters description="Encontrá rápido usuarios por rol, estado y alcance." [filters]="filters" />
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mt-5">
        @for (user of filteredUsers; track user.id) {
        <hta-card>
            <ng-container header>
                <div class="w-full">
                    <div class="flex justify-end">
                        <p-tag [value]=" statusLabel(user.status)" [severity]="statusSeverity(user.status)"
                            class="py-1 px-2 truncate text-xs"></p-tag>
                    </div>
                    <div class="flex items-center gap-3">
                        <p-avatar [label]="user.initials" size="large" shape="circle"
                            styleClass="bg-slate-100 dark:bg-[#0F172A] text-slate-700 dark:text-slate-300 font-bold border border-slate-200 dark:border-slate-700"></p-avatar>
                        <div class="overflow-hidden">
                            <h3 class="font-bold text-slate-900 dark:text-white truncate">{{user.fullName}}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">{{user.email}}</p>
                        </div>
                    </div>
                </div>
            </ng-container>
            <ng-container>
                <div class="flex flex-col gap-1.5">
                    <span
                        class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest">Rol
                        Principal</span>
                    <div>
                        <p-tag [value]="roleLabel(primaryRole(user))" [severity]="roleSeverity(primaryRole(user))"
                            class="py-1 px-2 truncate"></p-tag>
                    </div>
                </div>

                <div class="flex flex-col gap-1.5">
                    <span
                        class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest">Scope
                        Principal</span>
                    <p
                        class="text-sm font-medium text-slate-700 dark:text-slate-300 flex items-center gap-2 truncate w-full">
                        <i class="pi pi-map-marker text-primary-500"></i>
                        {{ primaryScopeLabel(user) }}
                    </p>
                </div>
            </ng-container>
            <ng-container footer>
                <div class="flex flex-col text-[10px] text-slate-400">
                    <span class="uppercase font-bold text-slate-500/50 dark:text-slate-600">Último acceso</span>
                    <span class="font-medium tracking-tighter">{{user.lastLoginAt}}</span>
                </div>
                <div class="flex gap-1">
                    <button (click)="openUserDrawer(user)"
                        class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-primary-500 transition-all">
                        <i class="pi pi-eye text-sm"></i>
                    </button>
                    <button (click)="openUserDrawer(user)"
                        class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-orange-500 transition-all">
                        <i class="pi pi-pencil text-sm"></i>
                    </button>
                </div>
            </ng-container>
        </hta-card>
        } @empty {
        <div
            class="col-span-full py-20 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-3xl">
            <i class="pi pi-users text-5xl mb-4 opacity-20"></i>
            <p class="text-lg font-medium">No se encontraron usuarios</p>
            <p class="text-sm opacity-60">Prueba ajustando los filtros de búsqueda.</p>
        </div>
        }
    </div>
</hta-section-wrapper>
