<div class="bg-slate-50 dark:bg-[#0F172A] transition-colors duration-300">
    <form [formGroup]="invitationForm" class="p-6 space-y-6">
        <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col gap-2">
                <hta-float-label-input formControlName="fullName" id="fullName" label="Nombre Completo" />
            </div>
            <div class="flex flex-col gap-2">
                <hta-float-label-input formControlName="email" id="email" label="Email" />
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Rol inicial</label>
                <hta-roles-dropdown formControlName="role" [setByName]="isDefaultUser() ? 'Owner' : ''" id="role" />
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-slate-700 dark:text-slate-300">Tipo de scope</label>
                <hta-scope-dropdown formControlName="scope" id="scope" [setByName]="isDefaultUser() ? 'Cliente' : ''" />
            </div>
        </div>
        <div class="flex flex-col gap-2 relative">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300 tracking-wide uppercase text-xs">
                Alcance inicial
            </label>
            <hta-scope-tree [nodes]="nodes" />
        </div>

        <div class="p-4 rounded-xl border transition-colors duration-300
                  bg-emerald-50 border-emerald-200 text-emerald-900
                  dark:bg-emerald-950/30 dark:border-emerald-800 dark:text-emerald-200">
            <h4 class="text-sm font-bold flex items-center gap-2">
                <i class="pi pi-info-circle"></i> Resumen
            </h4>
            <p class="text-sm mt-1">El usuario tendrá acceso como <span class="font-semibold">Viewer</span> sobre
                <span class="font-semibold">Cliente completo · Familia Pérez</span>.
            </p>
        </div>

    </form>
</div>
