<div class="mt-4 space-y-4">
    <form [formGroup]="invitationForm" class="dark:bg-black/20 rounded-2xl p-6 text-slate-900">
        <h5 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Nueva
            Asignación</h5>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-400">Rol</label>
                <hta-roles-dropdown id="role" formControlName="role" />
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-sm font-bold text-slate-400">Tipo de scope</label>
                <hta-scope-dropdown id="scope" formControlName="scope" />
            </div>
        </div>

        <div class="flex flex-col gap-2 relative">
            <label class="text-sm font-medium text-slate-700 dark:text-slate-300 tracking-wide uppercase text-xs">
                Alcance inicial
            </label>
            <hta-scope-tree [nodes]="nodes" />
        </div>

        <p class="text-[10px] text-slate-400 mb-4">Seleccioná cliente, sitio, zona o dispositivo. El
            tipo elegido se sincroniza automáticamente con el nodo.</p>

        <div class="flex justify-end">
            <hta-button label="Agregar asignación" icon="pi pi-plus" />
        </div>
    </form>

    <div class="p-5 rounded-2xl dark:bg-black/20">
        <h5 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4">
            Asignaciones Actuales</h5>
        <div class="p-4 rounded-xl flex justify-between items-center">
            <div>
                <p class="font-bold text-white text-sm">Owner</p>
                <p class="text-slate-400 text-xs">Cliente • Cliente completo • Familia Pérez</p>
            </div>
            <button class="text-slate-500 hover:text-red-400 transition-colors">
                <i class="pi pi-trash"></i>
            </button>
        </div>
    </div>
</div>
