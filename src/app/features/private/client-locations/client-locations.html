<hta-section-wrapper title="Sitios del cliente" class="internal-scroll"
    description="Ubicaciones geográficas y nodos IoT desplegados.">
    <ng-container header-tools>
        <div class="flex gap-3">
            <hta-button label="Nuevo Sitio" icon="pi pi-plus" (click)="newSite()" />
        </div>
    </ng-container>
    <div class="container">
        <div class="flex flex-col md:flex-row h-full w-full bg-surface-50">
            <div class="w-full md:w-1/3 lg:w-1/4 p-4 flex flex-col h-full gap-4 overflow-y-auto shadow-md z-10">
                @for (site of sites(); track site.siteId) {
                <hta-client-location-card [site]="site" (selectedSite)="selectSite($event)" />
                }
            </div>
            <div class="hidden md:block md:w-2/3 lg:w-3/4 relative z-0">
                <div htaRenderMap class="w-full" [name]="selectedSite()?.name" [lat]="selectedSite()?.latitude"
                    [lng]="selectedSite()?.longitude" style="height: 100%;"></div>
            </div>
            <div class="md:hidden fixed bottom-6 right-6 z-20">
                <p-button icon="pi pi-map" [rounded]="true" size="large" severity="primary"
                    class="shadow-xl"></p-button>
            </div>
        </div>
    </div>

</hta-section-wrapper>
