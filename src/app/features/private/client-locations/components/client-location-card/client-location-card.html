<div class="bg-white dark:bg-[#1E293B] border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden
                  shadow-sm hover:shadow-xl transition-all duration-300 group">

    <div class="p-5">
        <div class="flex justify-between items-start mb-2">
            <div>
                <hta-site-type-icon [siteType]="site().type" [size]="48" />
                <h3 class="text-xl font-bold text-slate-900 dark:text-white">{{site().name}}</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 flex items-center gap-2 mb-6">
                    <i class="pi pi-map-marker text-xs"></i>
                    {{site().address}}, {{site().city}}
                </p>
            </div>
            <div class="flex flex-col">
                <button (click)="openSiteDrawer()"
                    class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-orange-500 transition-all">
                    <i class="pi pi-pencil text-sm"></i>
                </button>
                <button (click)="markToSite(site())" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-orange-500
                transition-all">
                    <i class="icon-map-and-marker text-2xl"></i>
                </button>
            </div>

        </div>
    </div>
</div>
