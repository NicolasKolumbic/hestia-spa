<div class="bg-white dark:bg-[#1E293B] border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden
                  shadow-sm hover:shadow-xl transition-all duration-300 group">

    <div class="h-48 w-full bg-slate-200 dark:bg-[#0F172A] relative overflow-hidden flex items-center justify-center">
        <i class="pi pi-map-marker text-4xl text-primary-500/20 absolute"></i>
        <div class="absolute top-3 right-3 flex gap-2">
            <p-tag [value]="site() ? 'Online' : 'Offline'" [severity]="site().status ? 'success' : 'danger'"
                [rounded]="true"></p-tag>
        </div>
        <div
            class="absolute bottom-2 left-3 flex items-center gap-2 bg-black/40 backdrop-blur-md px-2 py-1 rounded-lg text-white text-xs">
            <i class="text-yellow-400"></i>
            <span>{{site().temperature}}°C</span>
        </div>
    </div>

    <div class="p-5">
        <div class="flex justify-between items-start mb-2">
            <h3 class="text-xl font-bold text-slate-900 dark:text-white">{{site().name}}</h3>
            <button class="text-slate-400 hover:text-primary-500 transiten-colors">
                <i class="pi pi-external-link"></i>
            </button>
        </div>

        <p class="text-sm text-slate-500 dark:text-slate-400 flex items-center gap-2 mb-6">
            <i class="pi pi-map-marker text-xs"></i>
            {{site().address}}, {{site().city}}
        </p>

        <div class="grid grid-cols-3 gap-2 py-4 border-t border-slate-100 dark:border-slate-700/50">
            <div class="text-center">
                <span class="block text-[10px] font-black text-slate-400 uppercase">Zonas</span>
                <span class="text-sm font-bold dark:text-slate-200">{{0}}</span>
            </div>
            <div class="text-center border-x border-slate-100 dark:border-slate-700/50">
                <span class="block text-[10px] font-black text-slate-400 uppercase">Devices</span>
                <span class="text-sm font-bold dark:text-slate-200">{{site().deviceCount}}</span>
            </div>
            <!--<div class="text-center">
                <span class="block text-[10px] font-black text-slate-400 uppercase">Alertas</span>
                <span class="text-sm font-bold text-orange-500" [class.text-slate-400]="site().alertas === 0">
                    {{site().alertas}}
                </span>
            </div>-->
        </div>

        <div class="mt-4 flex gap-2">
            <button class="flex-1 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold py-2 rounded-lg
                           hover:bg-primary-500 hover:text-white transition-all">
                Panel de Control
            </button>
            <button
                class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-400 hover:text-orange-500">
                <i class="pi pi-cog"></i>
            </button>
        </div>
    </div>
</div>
