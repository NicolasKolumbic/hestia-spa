<hta-section-wrapper title="Sitios del cliente" class="internal-scroll"
    description="Ubicaciones geográficas y nodos IoT desplegados.">
    <ng-container header-tools>
        <div class="flex gap-3">
            <hta-button label="Cancelar" icon="pi pi-times" severity="secondary" (click)="cancel()" />
            <hta-button label="Guardar" icon="pi pi-save" (click)="saveSite()" />
        </div>
    </ng-container>
    <div class="container">
        <div class="flex flex-col md:flex-row h-full w-full bg-surface-50">
            <div class="w-full md:w-1/3 lg:w-1/4 p-4 flex flex-col h-full gap-4 overflow-y-auto shadow-md z-10">
                <form [formGroup]="siteForm">
                    <fieldset>
                        <hta-site-type-dropdown formControlName="type" id="siteType" class="my-4" />
                        <hta-float-label-input formControlName="name" id="clientFullName" label="Nombre del locación"
                            class="my-4" />
                        <hta-float-label-input formControlName="addressLine" id="addressLine" label="Dirección"
                            class="my-4" />
                        <hta-float-label-input formControlName="city" id="city" label="Ciudad" class="my-4" />
                        <hta-float-label-input formControlName="province" id="province" label="Provincia"
                            class="my-4" />
                        <hta-float-label-input formControlName="latitude" id="latitude" label="Latitud" class="my-4" />
                        <hta-float-label-input formControlName="longitude" id="longitude" label="Longitud"
                            class="my-4" />
                        <hta-float-label-input formControlName="postalCode" id="postalCode" label="Código Postal"
                            class="my-4" />
                    </fieldset>
                </form>
            </div>
            <div class="hidden md:block md:w-2/3 lg:w-3/4 relative z-0">
                <div htaRenderMap class="w-full"
                    [name]="siteForm.get('name')?.value || site()?.name || 'Ubicación seleccionada'"
                    [lat]="siteForm.get('latitude')?.value" [lng]="siteForm.get('longitude')?.value" [readonly]="false"
                    (locationChange)="onLocationChange($event)" style="height: 100%;"></div>
            </div>
            <div class="md:hidden fixed bottom-6 right-6 z-20">
                <p-button icon="pi pi-map" [rounded]="true" size="large" severity="primary"
                    class="shadow-xl"></p-button>
            </div>
        </div>
    </div>
</hta-section-wrapper>
