<hta-section-wrapper title="Mis Espacios" description="Gestiona y monitorea tus habitaciones.">
    <ng-container header-tools>
        <div class="flex gap-3 items-center">
            <hta-search-field placeholder="Buscar sitios por nombre" (search)="searchHandler($event)"
                class="w-[15rem]" />
            <hta-button label="Nuevo Espacio" icon="pi pi-plus" (click)="newSpace()" />
        </div>
    </ng-container>
    <hta-cards-grid [items]="spaces()" emptyMessage="No se encontraron espacios">
        <ng-template #content let-space>
            <hta-space-card [space]="space" (delete)="deleteHandler($event)" (edit)="editHandler($event)" />
        </ng-template>
    </hta-cards-grid>
</hta-section-wrapper>
